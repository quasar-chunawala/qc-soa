site_name: libsoa
site_url: https://quasar-chunawala.github.io/qc-soa/
repo_url: https://github.com/quasar-chunawala/qc-soa
repo_name: quasar-chunawala/qc-soa
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Data Structures:
    - soa::vector<T>: vector.md
  - Runtime pre-condition checks: configuration.md
  - Setup:
      - Linux: SetupLinux.md
      - MacOS: SetupMacOS.md
      - Windows: SetupWin64.md
