site_name: libsoa
site_url: https://quasar-chunawala.github.io/qc-soa/
repo_url: https://github.com/quasar-chunawala/qc-soa
repo_name: quasar-chunawala/qc-soa
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Containers:
    - soa::vector<T>: vector.md
  - Runtime pre-condition checks: configuration.md
  - Configure and build: build.md
  - Developer Setup:
      - Linux: SetupLinux.md
      - MacOS: SetupMacOS.md
      - Windows: SetupWin64.md
