name: Linux x86 build
on: [push, pull_request]
defaults:
    run:
        shell: bash -l {0}

jobs:
    build:
        runs-on: ubuntu-latest
        name: '${{ matrix.sys.compiler }} ${{ matrix.sys.version }} - ${{ matrix.sys.flags }}'
        strategy:
            matrix:
                sys:
                    - { compiler: 'gcc', version: '16', flags: '-std=c++26 -Wall -Wpedantic -freflection'}
        steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Setup compiler
          if: ${{ matrix.sys.compiler == 'gcc' }}
          run: |
            GCC_VERSION=${{ matrix.sys.version }}
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get --no-install-suggests --no-install-recommends install g++-$GCC_VERSION
            sudo apt-get update
            echo "CXX=g++-$GCC_VERSION" >> $GITHUB_ENV

        - name: Configure
          env: 
            CXX: ${{ env.CXX }}
          run: |
            cmake -B build \
                  -DCMAKE_CXX_COMPILER=$CXX \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_CXX_FLAGS="${{ matrix.sys.flags }}"
        - name: Build
          run: cmake --build build --parallel 2        
        - name: Test
          run: ctest --test-dir build --output-on-failure --timeout 60 --parallel 2                    
              