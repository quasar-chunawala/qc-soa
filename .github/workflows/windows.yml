name: Windows build
on: [push, pull_request]
jobs:
  build-windows-gcc:
    name: 'MSVC ${{ matrix.os }}, ${{ matrix.target }}'
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        include:
          - { target: x64, msystem: UCRT64,  pkg: ucrt-x86_64 }
          - { target: x86, msystem: MINGW32, pkg: i686 }
    runs-on: windows-${{ matrix.os }}
    steps:
    - name: Install MingW
      - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja     

    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure
      run:  cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-std=c++26 -Wall -Wpedantic -freflection"

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 60 --parallel 2  